name: Build and release FPK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: fpk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          package_version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' packaging/fnos/manifest)"
          release_tag="v${package_version}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${package_version}." >&2
            exit 1
          fi
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Download fnOS packer
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 \
            --output "${RUNNER_TEMP}/fnpack"
          chmod 755 "${RUNNER_TEMP}/fnpack"
          "${RUNNER_TEMP}/fnpack" --help >/dev/null

      - name: Build FPK
        env:
          FNPACK_BIN: ${{ runner.temp }}/fnpack
          MDC_WHEEL_CACHE: ${{ runner.temp }}/meizang-mdc-wheels
        run: ./scripts/build-fpk.sh

      - name: Verify package
        shell: bash
        run: |
          sha256sum --check meizang.fpk.sha256
          tar -xOzf meizang.fpk manifest | grep -E '^(appname|version|platform)'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: meizang-${{ github.ref_name }}-x86
          path: |
            meizang.fpk
            meizang.fpk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" meizang.fpk meizang.fpk.sha256 --clobber
          else
            gh release create "${RELEASE_TAG}" meizang.fpk meizang.fpk.sha256 \
              --target "${GITHUB_SHA}" \
              --title "媒藏 ${RELEASE_TAG}" \
              --generate-notes
          fi
